<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credit Card Benefits Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#F8F7F4;--surface:#FFF;--surface2:#F2F1EE;--surface3:#E8E7E3;
  --border:rgba(0,0,0,.09);--border-med:rgba(0,0,0,.14);--border-str:rgba(0,0,0,.22);
  --text:#1A1A18;--text2:#5A5A56;--text3:#9A9A96;--text4:#C0C0BC;
  --radius:10px;--radius-lg:14px;--radius-xl:18px;
  --danger:#C0392B;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#141413;--surface:#1E1E1C;--surface2:#252523;--surface3:#2E2E2B;
  --border:rgba(255,255,255,.08);--border-med:rgba(255,255,255,.13);--border-str:rgba(255,255,255,.2);
  --text:#EDEDE8;--text2:#9A9A95;--text3:#5A5A58;--text4:#3A3A38;
}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:0 36px}
@media(max-width:600px){.wrap{padding:0 16px}}

/* HEADER */
.site-hdr{padding:28px 0 0}
.site-hdr-row{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;padding-bottom:20px;border-bottom:.5px solid var(--border)}
.site-title{font-family:'DM Serif Display',serif;font-size:26px;font-weight:400;letter-spacing:-.3px}
.site-sub{font-size:13px;color:var(--text2);margin-top:3px}

/* PRIMARY NAV */
.primary-nav{display:flex;gap:0;border-bottom:.5px solid var(--border)}
.pnav-btn{padding:14px 22px;background:none;border:none;border-bottom:2.5px solid transparent;cursor:pointer;font-family:inherit;font-size:14px;font-weight:500;color:var(--text2);transition:all .15s;margin-bottom:-1px;letter-spacing:-.1px}
.pnav-btn:hover{color:var(--text)}
.pnav-btn.active{color:var(--text);border-bottom-color:var(--text)}

/* CARD TABS */
.card-tabs-bar{padding:22px 0 0}
.card-tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* individual tab wrapper for × positioning */
.ctab-wrap{position:relative;display:inline-flex;align-items:center}
.ctab{padding:8px 30px 8px 16px;border:.5px solid var(--border-med);border-radius:20px;cursor:pointer;font-size:13px;font-weight:500;background:var(--surface);color:var(--text2);font-family:inherit;transition:all .15s;white-space:nowrap}
.ctab:hover{background:var(--surface2)}
.ctab.active{color:#fff;border-color:transparent}
.ctab.active + .ctab-del{color:rgba(255,255,255,.7)}
.ctab.active + .ctab-del:hover{color:#fff}
.ctab-del{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:14px;line-height:1;color:var(--text3);padding:2px 4px;font-family:inherit;transition:color .15s}
.ctab-del:hover{color:var(--danger)}

/* add card button */
.add-card-btn{padding:7px 14px;border:.5px dashed var(--border-med);border-radius:20px;cursor:pointer;font-size:13px;font-weight:500;background:none;color:var(--text3);font-family:inherit;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:5px}
.add-card-btn:hover{border-color:var(--border-str);color:var(--text2);background:var(--surface)}

/* delete confirm banner */
.del-confirm{background:var(--surface);border:.5px solid var(--border-med);border-radius:var(--radius);padding:12px 16px;margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.del-confirm-text{font-size:13px;flex:1}
.del-confirm-text strong{color:var(--danger)}
.del-btn{padding:6px 14px;border-radius:var(--radius);border:.5px solid;cursor:pointer;font-size:13px;font-family:inherit;font-weight:500;transition:all .15s}
.del-btn-confirm{background:var(--danger);color:#fff;border-color:var(--danger)}
.del-btn-confirm:hover{opacity:.85}
.del-btn-cancel{background:var(--surface);color:var(--text2);border-color:var(--border-med)}
.del-btn-cancel:hover{background:var(--surface2)}

/* add card form panel */
.add-form-panel{background:var(--surface);border:.5px solid var(--border-med);border-radius:var(--radius-lg);padding:20px;margin-top:14px}
.add-form-title{font-size:14px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:540px){.form-grid{grid-template-columns:1fr}}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group label{font-size:12px;font-weight:500;color:var(--text2)}
.form-group input,.form-group select{padding:8px 12px;border:.5px solid var(--border-med);border-radius:var(--radius);background:var(--surface);color:var(--text);font-family:inherit;font-size:13px;outline:none;transition:border-color .15s;width:100%}
.form-group input:focus{border-color:var(--border-str)}
.form-group input[type="color"]{padding:4px 8px;height:36px;cursor:pointer}
.form-hint{font-size:11px;color:var(--text3);margin-top:2px}
.form-actions{display:flex;gap:8px;margin-top:4px}
.form-save{padding:8px 18px;border-radius:var(--radius);border:none;cursor:pointer;font-size:13px;font-family:inherit;font-weight:500;background:var(--text);color:var(--bg);transition:opacity .15s}
.form-save:hover{opacity:.85}
.form-cancel{padding:8px 14px;border-radius:var(--radius);border:.5px solid var(--border-med);cursor:pointer;font-size:13px;font-family:inherit;background:none;color:var(--text2)}
.form-cancel:hover{background:var(--surface2)}
.form-error{font-size:12px;color:var(--danger);margin-top:6px}

/* MAIN */
.main{padding:28px 0 60px}

/* CARD HEADER */
.card-hdr{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:24px;padding-bottom:20px;border-bottom:.5px solid var(--border)}
.card-name{font-family:'DM Serif Display',serif;font-size:22px;font-weight:400;letter-spacing:-.2px}
.card-fee-row{display:flex;align-items:center;gap:12px;margin-top:5px;flex-wrap:wrap}
.card-fee{font-size:13px;color:var(--text2)}
.card-val-badge{display:inline-block;font-size:12px;font-weight:500;padding:3px 10px;border-radius:12px}
.refresh-btn{display:flex;align-items:center;gap:7px;padding:9px 16px;border:.5px solid var(--border-med);border-radius:var(--radius);background:var(--surface);cursor:pointer;font-size:13px;font-family:inherit;color:var(--text2);font-weight:500;transition:all .15s;flex-shrink:0}
.refresh-btn:hover{background:var(--surface2);color:var(--text)}
.refresh-btn:disabled{opacity:.5;cursor:not-allowed}

/* METRICS */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:28px}
@media(max-width:650px){.metrics{grid-template-columns:repeat(2,1fr)}}
.metric{background:var(--surface2);border-radius:var(--radius);padding:14px 16px}
.metric-lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.metric-val{font-size:22px;font-weight:600;letter-spacing:-.5px}

/* SECTIONS */
.section{margin-bottom:28px}
.sec-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px;display:flex;align-items:center;gap:7px}

/* BENEFIT CARDS */
.bg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.ben{background:var(--surface);border:.5px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;transition:border-color .15s}
.ben:hover{border-color:var(--border-med)}
.ben-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:5px}
.ben-vendor{font-size:13px;font-weight:500;line-height:1.35;flex:1}
.ben-amount{font-size:18px;font-weight:600;white-space:nowrap;letter-spacing:-.5px;flex-shrink:0}
.ben-freq{font-size:11px;color:var(--text2);margin-bottom:7px}
.ben-note{font-size:11px;color:var(--text3);border-top:.5px solid var(--border);padding-top:8px;line-height:1.55}
.custom-empty{background:var(--surface2);border-radius:var(--radius-lg);padding:24px;text-align:center;font-size:13px;color:var(--text3);line-height:1.6}

/* STATUS */
.status-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.status-item{background:var(--surface);border:.5px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px;display:flex;align-items:center;gap:11px}
.status-ico{font-size:22px;flex-shrink:0}
.status-name{font-size:13px;font-weight:500}
.status-tier{font-size:11px;color:var(--text2);margin-top:2px}
.lounge-box{background:var(--surface2);border-radius:var(--radius);padding:13px 16px;font-size:13px;color:var(--text2);display:flex;gap:10px;align-items:flex-start;line-height:1.6}
.partner-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.partner{background:var(--surface);border:.5px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px}
.partner-name{font-size:13px;font-weight:500;margin-bottom:4px}
.partner-note{font-size:11px;color:var(--text2);line-height:1.5}
.excl-badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;margin-bottom:5px;background:#FEF3C7;color:#78350F}
.shop-chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:5px 12px;background:var(--surface);border:.5px solid var(--border);border-radius:20px;font-size:12px;color:var(--text2)}

/* INFO CHIPS (for perk bullets) */
.perk-list{display:flex;flex-direction:column;gap:8px}
.perk-item{background:var(--surface2);border-radius:var(--radius);padding:10px 14px;font-size:13px;color:var(--text2);display:flex;gap:10px;align-items:flex-start;line-height:1.55}
.perk-ico{font-size:16px;flex-shrink:0;margin-top:1px}

/* AI BOX */
.ai-box{background:var(--surface);border:.5px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;margin-top:8px}
.ai-box-hdr{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.ai-content{font-size:13.5px;line-height:1.75}
.ai-stamp{font-size:11px;color:var(--text3);margin-top:10px;padding-top:10px;border-top:.5px solid var(--border)}
.ai-hint{font-size:13px;color:var(--text2);padding:4px 0}

/* ══ SPEND OPTIMIZER ══ */
.opt-intro{font-size:14px;color:var(--text2);padding:22px 0 4px;line-height:1.65}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:8px;margin:18px 0 28px}
.cat-tile{background:var(--surface);border:.5px solid var(--border);border-radius:var(--radius-lg);padding:16px 12px;cursor:pointer;text-align:center;transition:all .15s;user-select:none}
.cat-tile:hover{border-color:var(--border-med);background:var(--surface2)}
.cat-tile.sel{border-width:1.5px;border-color:var(--text);background:var(--surface2)}
.cat-ico{font-size:28px;margin-bottom:8px}
.cat-name{font-size:12px;font-weight:600;line-height:1.3}
.cat-desc{font-size:11px;color:var(--text3);margin-top:3px;line-height:1.3}
.rec-panel{background:var(--surface);border:.5px solid var(--border);border-radius:var(--radius-xl);overflow:hidden;margin-bottom:60px}
.rec-header{padding:22px 26px 18px;border-bottom:.5px solid var(--border)}
.rec-cat-eyebrow{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.rec-cat-name{font-size:21px;font-weight:500;letter-spacing:-.3px}
.rec-cat-desc{font-size:13px;color:var(--text2);margin-top:5px}
.top-picks{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:20px 26px 16px}
@media(max-width:580px){.top-picks{grid-template-columns:1fr}}
.pick{border-radius:var(--radius-lg);padding:20px;position:relative;border:.5px solid transparent}
.pick-medal{position:absolute;top:16px;right:16px;font-size:22px}
.pick-rank{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;opacity:.8}
.pick-card-name{font-size:17px;font-weight:600;letter-spacing:-.3px;margin-bottom:4px}
.pick-rate{font-size:28px;font-weight:700;letter-spacing:-.8px;margin-bottom:2px;line-height:1}
.pick-eff{font-size:12px;font-weight:500;margin-bottom:10px}
.pick-why{font-size:12.5px;line-height:1.6;color:var(--text2)}
.pick-perks{font-size:12px;margin-top:10px;padding:10px 12px;background:rgba(0,0,0,.05);border-radius:8px;line-height:1.6;color:var(--text2)}
@media(prefers-color-scheme:dark){.pick-perks{background:rgba(255,255,255,.06)}}
.rec-divider{height:.5px;background:var(--border);margin:0 26px}
.ranking-section{padding:18px 26px 22px}
.rank-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.rank-table{width:100%;border-collapse:collapse;font-size:13px}
.rank-table th{text-align:left;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);padding:0 10px 8px;border-bottom:.5px solid var(--border)}
.rank-table td{padding:10px 10px;border-bottom:.5px solid var(--border);vertical-align:middle}
.rank-table tr:last-child td{border-bottom:none}
.rank-table tr:hover td{background:var(--surface2)}
.rnum{font-size:11px;font-weight:700;width:24px}
.rname{font-weight:500}
.rrate{font-weight:600;white-space:nowrap}
.reff{color:var(--text2);white-space:nowrap;font-size:12px}
.rwhy{color:var(--text2);font-size:12px}

@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .7s linear infinite;display:inline-block}
</style>
</head>

function cardById(id){ return CARDS.find(c=>c.id===id); }
function cardShortName(id){ return cardById(id)?.name || id; }

function hexToRgba(hex,alpha){
  hex = hex.replace('#','');
  if(hex.length===3) hex=hex.split('').map(x=>x+x).join('');
  const r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function lightenHex(hex){
  // produce a light bg and dark text from color
  hex = hex.replace('#','');
  if(hex.length===3) hex=hex.split('').map(x=>x+x).join('');
  const r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);
  const bg=`rgba(${r},${g},${b},0.1)`;
  return {bg, fg:hex};
}

/* ════════════════════════════════
   VIEW SWITCHING
════════════════════════════════ */
function switchView(v){
  currentView=v;
  document.getElementById('view-cards').style.display = v==='cards'?'':'none';
  document.getElementById('view-optimizer').style.display = v==='optimizer'?'':'none';
  document.getElementById('nav-cards').classList.toggle('active',v==='cards');
  document.getElementById('nav-optimizer').classList.toggle('active',v==='optimizer');
}

/* ════════════════════════════════
   TABS + DELETE + ADD FORM
════════════════════════════════ */
function renderTabs(){
  const tabs = CARDS.map(c=>{
    const isActive = c.id===activeCard?.id;
    const activeStyle = isActive ? `background:${c.color};border-color:${c.color}` : '';
    return `<div class="ctab-wrap">
      <button class="ctab${isActive?' active':''}" style="${activeStyle}" onclick="setCard('${c.id}')">${c.name}</button>
      <button class="ctab-del" onclick="askDelete('${c.id}')" title="Delete card" aria-label="Delete ${c.name}">×</button>
    </div>`;
  }).join('');

  document.getElementById('ctabs').innerHTML = tabs +
    `<button class="add-card-btn" onclick="toggleAddForm()">+ Add card</button>`;

  // delete confirm
  const dc = document.getElementById('delConfirm');
  if(pendingDelete){
    const card = cardById(pendingDelete);
    dc.style.display='';
    dc.innerHTML=`<div class="del-confirm">
      <div class="del-confirm-text">Delete <strong>${card?.name||pendingDelete}</strong>? This cannot be undone.</div>
      <button class="del-btn del-btn-confirm" onclick="confirmDelete()">Delete</button>
      <button class="del-btn del-btn-cancel" onclick="cancelDelete()">Cancel</button>
    </div>`;
  } else { dc.style.display='none'; dc.innerHTML=''; }

  // add form
  const afp = document.getElementById('addFormPanel');
  if(showAddForm){
    afp.style.display='';
    afp.innerHTML=`<div class="add-form-panel">
      <div class="add-form-title">+ Add a new card</div>
      <div class="form-grid">
        <div class="form-group">
          <label>Short name (tab label)</label>
          <input type="text" id="f-name" placeholder="e.g. Chase Sapphire Preferred" maxlength="30">
        </div>
        <div class="form-group">
          <label>Full card name</label>
          <input type="text" id="f-fullname" placeholder="e.g. Chase Sapphire Preferred® Card" maxlength="60">
        </div>
        <div class="form-group">
          <label>Annual fee</label>
          <input type="text" id="f-fee" placeholder="e.g. $95/yr" maxlength="20">
        </div>
        <div class="form-group">
          <label>Estimated annual value</label>
          <input type="text" id="f-value" placeholder="e.g. $500+ est. annual credit value" maxlength="40">
        </div>
        <div class="form-group">
          <label>Card accent color</label>
          <input type="color" id="f-color" value="#1A4E8C">
          <span class="form-hint">Used for tab and benefit highlights</span>
        </div>
      </div>
      <div class="form-hint" style="margin-bottom:12px">After adding, use <strong>Check for updates ↗</strong> on the card to auto-populate its latest benefits via web search.</div>
      <div class="form-actions">
        <button class="form-save" onclick="saveNewCard()">Add card</button>
        <button class="form-cancel" onclick="cancelAddForm()">Cancel</button>
      </div>
      <div id="form-error" class="form-error"></div>
    </div>`;
  } else { afp.style.display='none'; afp.innerHTML=''; }
}

function setCard(id){
  activeCard = cardById(id);
  pendingDelete = null;
  showAddForm = false;
  renderTabs();
  renderCardContent();
}

function askDelete(id){
  if(CARDS.length <= 1){ alert('You must have at least one card.'); return; }
  pendingDelete = id;
  showAddForm = false;
  renderTabs();
}

function cancelDelete(){ pendingDelete = null; renderTabs(); }

function confirmDelete(){
  const id = pendingDelete;
  const idx = CARDS.findIndex(c=>c.id===id);
  CARDS.splice(idx, 1);
  saveCards();
  pendingDelete = null;
  // pick adjacent card
  const newIdx = Math.min(idx, CARDS.length-1);
  activeCard = CARDS[newIdx];
  renderTabs();
  renderCardContent();
}

function toggleAddForm(){
  showAddForm = !showAddForm;
  pendingDelete = null;
  renderTabs();
  if(showAddForm){
    setTimeout(()=>{ document.getElementById('f-name')?.focus(); },50);
  }
}

function cancelAddForm(){ showAddForm = false; renderTabs(); }

function saveNewCard(){
  const name = document.getElementById('f-name')?.value.trim();
  const fullName = document.getElementById('f-fullname')?.value.trim();
  const fee = document.getElementById('f-fee')?.value.trim();
  const totalValue = document.getElementById('f-value')?.value.trim();
  const color = document.getElementById('f-color')?.value || '#1A4E8C';
  const errEl = document.getElementById('form-error');

  if(!name){ errEl.textContent='Short name is required.'; return; }
  if(!fullName){ errEl.textContent='Full card name is required.'; return; }

  const id = 'custom-' + Date.now();
  // derive light bg from color
  const newCard = {
    id, name, fullName,
    fee: fee||'N/A',
    color,
    valueBg: hexToRgba(color, 0.15),
    valueFg: color,
    totalValue: totalValue||'',
    isBuiltin: false,
    monthly:[], annual:[], bonus:[], status:[],
    lounge:null, shopping:[], partners:[], unique:[]
  };

  CARDS.push(newCard);
  saveCards();
  showAddForm = false;
  activeCard = newCard;
  renderTabs();
  renderCardContent();
}

/* ════════════════════════════════
   CARD BENEFITS VIEW
════════════════════════════════ */
function section(title,icon,html){ return `<div class="section"><div class="sec-title">${icon} ${title}</div>${html}</div>`; }

function benGrid(items,cardColor){
  return `<div class="bg">${items.map(b=>`
    <div class="ben">
      <div class="ben-top"><div class="ben-vendor">${b.vendor}</div><div class="ben-amount" style="color:${cardColor}">${b.amount||b.rate}</div></div>
      ${b.annual?`<div class="ben-freq">${b.annual} · ${b.freq}</div>`:''}
      ${b.freq&&!b.annual?`<div class="ben-freq">${b.freq}</div>`:''}
      ${b.note?`<div class="ben-note">${b.note}</div>`:''}
    </div>`).join('')}
  </div>`;
}

function renderCardContent(){
  if(!activeCard){ document.getElementById('card-main').innerHTML=''; return; }
  const c=activeCard, aid=c.id, upd=aiUpdates[aid], checked=lastChecked[aid];
  const isCustom = !c.isBuiltin;
  const hasNoData = isCustom && !c.monthly.length && !c.annual.length && !c.bonus.length && !c.status.length;

  document.getElementById('card-main').innerHTML=`
    <div class="card-hdr">
      <div>
        <div class="card-name">${c.fullName}</div>
        <div class="card-fee-row">
          <span class="card-fee">Annual fee: ${c.fee}</span>
          ${c.totalValue?`<span class="card-val-badge" style="background:${c.valueBg||hexToRgba(c.color,0.12)};color:${c.color}">${c.totalValue}</span>`:''}
        </div>
      </div>
      <button class="refresh-btn" id="refreshBtn" onclick="refreshBenefits()">${icoRefresh()} Check for updates ↗</button>
    </div>

    <div class="metrics">
      <div class="metric"><div class="metric-lbl">Monthly credits</div><div class="metric-val" style="color:${c.color}">${c.monthly.length}</div></div>
      <div class="metric"><div class="metric-lbl">Annual / semi-annual</div><div class="metric-val" style="color:${c.color}">${c.annual.length}</div></div>
      <div class="metric"><div class="metric-lbl">Partner statuses</div><div class="metric-val" style="color:${c.color}">${c.status.length}</div></div>
      <div class="metric"><div class="metric-lbl">Total credit sources</div><div class="metric-val" style="color:${c.color}">${c.monthly.length+c.annual.length}</div></div>
    </div>

    ${hasNoData ? `<div class="custom-empty">No benefit details added yet.<br>Click <strong>Check for updates ↗</strong> above to search the web and auto-populate this card's latest benefits.</div>` : ''}

    ${c.monthly.length ? section('Monthly credits — reset every month',icoMonth(),benGrid(c.monthly,c.color)) : ''}
    ${c.annual.length  ? section('Annual &amp; semi-annual credits',icoAnnual(),benGrid(c.annual,c.color)) : ''}
    ${c.bonus&&c.bonus.length ? section('Bonus earning rates',icoStar(),benGrid(c.bonus,c.color)) : ''}

    ${c.status&&c.status.length ? section('Complimentary partner status',icoAward(),`
      <div class="status-grid">${c.status.map(s=>`
        <div class="status-item">
          <div class="status-ico">${s.icon}</div>
          <div><div class="status-name">${s.name}</div><div class="status-tier">${s.tier}</div></div>
        </div>`).join('')}
      </div>`) : ''}

    ${c.lounge ? section('Airport lounge access',icoLounge(),`<div class="lounge-box"><span style="font-size:18px;flex-shrink:0">✈️</span><span>${c.lounge}</span></div>`) : ''}

    ${c.unique&&c.unique.length ? section('Additional card perks',icoInfo(),`
      <div class="perk-list">${c.unique.map(p=>`
        <div class="perk-item">
          <div class="perk-ico">✦</div>
          <div><strong style="font-size:13px">${p.name}</strong><br><span style="font-size:12px">${p.note}</span></div>
        </div>`).join('')}
      </div>`) : ''}

    ${c.shopping&&c.shopping.length ? section('Shopping portal partners',icoShop(),`<div class="shop-chips">${c.shopping.map(s=>`<span class="chip">${s}</span>`).join('')}</div>`) : ''}

    ${c.partners&&c.partners.length ? section('Transfer partners — ThankYou® Points',icoXfer(),`
      <div class="partner-grid">${c.partners.map(p=>`
        <div class="partner">
          ${p.badge?'<span class="excl-badge">★ EXCLUSIVE</span>':''}
          <div class="partner-name">${p.name}</div>
          <div class="partner-note">${p.note}</div>
        </div>`).join('')}
      </div>`) : ''}

    <div class="section">
      <div class="sec-title">${icoAI()} AI benefit update check</div>
      ${upd ? `<div class="ai-box"><div class="ai-box-hdr">Latest update — web search sourced</div><div class="ai-content">${upd}</div>${checked?`<div class="ai-stamp">Last checked: ${checked}</div>`:''}</div>`
            : `<p class="ai-hint">Click <strong>Check for updates ↗</strong> to search the web for the latest benefit changes${isCustom?' and populate this card\'s benefits':' for this card'}. Run monthly before your credits reset.</p>`}
    </div>`;
}

async function refreshBenefits(){
  const btn=document.getElementById('refreshBtn');
  if(!btn||btn.disabled) return;
  btn.disabled=true;
  btn.innerHTML=`<span class="spin">${icoRefresh()}</span> Searching…`;
  const aid=activeCard.id;
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:900,
        tools:[{type:'web_search_20250305',name:'web_search'}],
        messages:[{role:'user',content:`Search for the LATEST 2025 or 2026 benefit changes for the ${activeCard.fullName}. Focus on: (1) specific merchant or vendor credits with amounts and reset frequencies, (2) new or removed vendor partnerships, (3) bonus earning rates. Give a concise, direct summary. Plain prose only.`}]
      })});
    const data=await resp.json();
    const text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join(' ').trim();
    aiUpdates[aid]=text
      ? text.replace(/\n\n/g,'</p><p style="margin-top:10px">').replace(/\n/g,' ').replace(/^/,'<p>').replace(/$/,'</p>')
      : '<p style="color:var(--text2)">No major recent changes found. Benefits appear current.</p>';
  }catch(e){ aiUpdates[aid]='<p style="color:var(--text2)">Update check unavailable. Please verify directly at the card issuer\'s website.</p>'; }
  lastChecked[aid]=new Date().toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
  document.getElementById('globalStamp').textContent='Last checked: '+lastChecked[aid];
  renderCardContent();
}

/* ════════════════════════════════
   SPEND OPTIMIZER VIEW
════════════════════════════════ */
function renderCatGrid(){
  document.getElementById('catGrid').innerHTML=CATEGORIES.map(cat=>`
    <div class="cat-tile${selectedCat===cat.id?' sel':''}"
      ${selectedCat===cat.id?'style="border-color:var(--text)"':''}
      onclick="selectCat('${cat.id}')">
      <div class="cat-ico">${cat.icon}</div>
      <div class="cat-name">${cat.name}</div>
      <div class="cat-desc">${cat.desc}</div>
    </div>`).join('');
}

function selectCat(id){
  selectedCat=id;
  renderCatGrid();
  renderRec(id);
  document.getElementById('recPanel').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function renderRec(catId){
  const cat=CATEGORIES.find(c=>c.id===catId);
  const ratings=RATINGS[catId];
  if(!cat||!ratings){document.getElementById('recPanel').innerHTML='';return;}

  const sorted=Object.entries(ratings).map(([cid,r])=>({cid,...r})).sort((a,b)=>b.eff-a.eff);
  const [p1,p2,...rest]=sorted;

  function effLabel(eff){ return eff>=50?'Credit-based value':eff===0?'No earning rate':eff.toFixed(1)+'% effective return'; }
  function medal(i){ return ['🥇','🥈','🥉'][i]||''; }

  function renderPick(item,rank){
    const builtinCard = BUILTIN_CARDS.find(c=>c.id===item.cid);
    const cardColor = builtinCard?.color||'#888';
    const bg=hexToRgba(cardColor,rank===0?0.1:0.06);
    const br=hexToRgba(cardColor,rank===0?0.35:0.18);
    return `<div class="pick" style="background:${bg};border-color:${br}">
      <div class="pick-medal">${medal(rank)}</div>
      <div class="pick-rank" style="color:${cardColor}">${rank===0?'Best pick':'Runner-up'}</div>
      <div class="pick-card-name">${builtinCard?.name||item.cid}</div>
      <div class="pick-rate" style="color:${cardColor}">${item.rate}</div>
      <div class="pick-eff" style="color:${cardColor}">${effLabel(item.eff)}</div>
      <div class="pick-why">${item.highlight}</div>
      ${item.perks?`<div class="pick-perks">${item.perks}</div>`:''}
    </div>`;
  }

  document.getElementById('recPanel').innerHTML=`
    <div class="rec-panel">
      <div class="rec-header">
        <div class="rec-cat-eyebrow">Best card for</div>
        <div class="rec-cat-name">${cat.icon} ${cat.name}</div>
        <div class="rec-cat-desc">${cat.desc} — ranked by effective % return (rate × estimated point value)</div>
      </div>
      <div class="top-picks">${renderPick(p1,0)}${renderPick(p2,1)}</div>
      <div class="rec-divider"></div>
      <div class="ranking-section">
        <div class="rank-title">Full ranking — all 6 built-in cards</div>
        <table class="rank-table">
          <thead><tr>
            <th style="width:28px">#</th><th>Card</th><th>Earn rate</th><th>Effective return</th><th>Why</th>
          </tr></thead>
          <tbody>${sorted.map((item,i)=>{
            const bc=BUILTIN_CARDS.find(c=>c.id===item.cid);
            const clr=bc?.color||'#888';
            return `<tr>
              <td class="rnum" style="color:${clr}">${i+1}</td>
              <td><span class="rname">${bc?.name||item.cid}</span></td>
              <td><span class="rrate" style="color:${clr}">${item.rate}</span></td>
              <td class="reff">${effLabel(item.eff)}</td>
              <td class="rwhy">${item.highlight}</td>
            </tr>`;
          }).join('')}</tbody>
        </table>
        <p style="font-size:11px;color:var(--text3);margin-top:12px">Custom cards you add are not included in the optimizer rankings.</p>
      </div>
    </div>`;
}

/* ════════════════════════════════
   INIT
════════════════════════════════ */
loadCards();
activeCard = CARDS[0] || null;
renderTabs();
renderCardContent();
renderCatGrid();
</script>
